<!DOCTYPE html>
<html lang="en">
  <head>
    <style>
      html {
        visibility: hidden;
        opacity: 0;
      }
    </style>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      name="description"
      content="SavePaste Text - Remove duplicate lines from pasted text"
    />
    <meta
      name="keywords"
      content="text deduplication, remove duplicate lines, text processing"
    />
    <meta name="author" content="mesfrum" />
    <meta name="robots" content="index,follow" />
    <meta name="googlebot" content="index,follow" />
    <link rel="icon" type="image/svg+xml" href="favico.svg" />
    <link
      rel="preload"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap"
      as="style"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css?family=Open+Sans:300&display=swap"
        rel="stylesheet"
        type="text/css"
      />
    </noscript>
    <title>savepaste - Text Deduplication</title>
    <script type="module" src="text.ts" defer></script>
  </head>
  <body
    class="relative flex min-h-screen bg-slate-200 flex-col justify-around items-center justify-center"
  >
    <nav class="absolute top-4 left-1/2 -translate-x-1/2 z-[999999] flex gap-4">
      <a
        href="/"
        class="text-3xl font-bold flex gap-2 item-center tracking-wider text-gray-400 hover:underline hover:text-gray-500"
        style="font-family: 'Poppins', sans-serif"
        >savepaste</a
      >
      <a
        href="/text.html"
        class="text-3xl font-bold flex gap-2 item-center tracking-wider text-gray-400 hover:underline hover:text-gray-500"
        style="font-family: 'Poppins', sans-serif"
        >text</a
      >
    </nav>
    <div class="p-4 w-full max-w-3xl">
      <h1 class="text-2xl font-bold mb-4 text-center text-gray-700">
        Remove Duplicate Lines
      </h1>
      <textarea
        id="inputText"
        class="w-full h-40 p-2 mb-4 border border-gray-300 rounded"
        placeholder="Paste your text here..."
      ></textarea>
      <button
        id="dedupButton"
        class="w-full bg-blue-500 text-white py-2 rounded hover:bg-blue-600 transition-colors"
      >
        Remove Duplicates
      </button>
      <textarea
        id="outputText"
        class="w-full h-40 p-2 mt-4 border border-gray-300 rounded"
        readonly
        placeholder="Deduplicated text will appear here..."
      ></textarea>
    </div>
  </body>
</html>
